plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.fantasybosses'
version = '0.8.0'
base { archivesName = 'fantasybosses' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
}
dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    // 순수 규칙 테스트 (2026-11-20 v0.8)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { fantasybosses { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('wrapper', Wrapper).configure { gradleVersion = '9.2.1'; distributionType = Wrapper.DistributionType.BIN }
