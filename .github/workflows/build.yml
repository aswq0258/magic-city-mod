name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check Maven publication (same as JitPack)
        run: ./gradlew publishToMavenLocal --no-daemon --no-configuration-cache

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: magic-city-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 편의 모드 royalqol (클라이언트 전용, 독립 빌드: royalqol/)
      - name: Build royalqol
        run: ./gradlew -p royalqol build --no-daemon

      - name: Upload royalqol jar
        uses: actions/upload-artifact@v4
        with:
          name: royalqol-jar
          path: royalqol/build/libs/*.jar
          if-no-files-found: error

      # 챕터 보스 모드 fantasybosses (독립 빌드: fantasybosses/, 2026-11-20 라디키온)
      - name: Build fantasybosses
        run: ./gradlew -p fantasybosses build --no-daemon --console=plain

      - name: Upload fantasybosses jar
        uses: actions/upload-artifact@v4
        with:
          name: fantasybosses-jar
          path: fantasybosses/build/libs/*.jar
          if-no-files-found: error
